name: Checks and site
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - name: Check out only the exact SDK HTTP sources needed by the host guard test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: espressif/esp-idf
          ref: fff9895c82d744c7237be8847347bdd1b07c6643
          path: toolchain/esp-idf-guard
          fetch-depth: 1
          sparse-checkout: |
            components/esp_http_client
            components/http_parser
          persist-credentials: false
      - name: Run all host suites and annotate each failure
        env:
          IDF_PATH: ${{ github.workspace }}/toolchain/esp-idf-guard
        run: |
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = fff9895c82d744c7237be8847347bdd1b07c6643
          test -f "$IDF_PATH/components/esp_http_client/esp_http_client.c"
          test -f "$IDF_PATH/components/http_parser/http_parser.c"
          python tools/tests/run_ci_host_tests.py release update settings online_update online_update_guard power
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: npm install --global pnpm@11.28.5
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run check && pnpm run build
        working-directory: site
  deploy-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: site
