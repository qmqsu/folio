name: Tagged preview release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - run: |
          sh tools/tests/run_release_tests.sh
          sh tools/tests/run_update_tests.sh
          sh tools/tests/run_online_update_tests.sh
          sh tools/tests/run_power_tests.sh
      - name: Validate tag and derive sequence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_ci.py version "$RELEASE_TAG" > "$RUNNER_TEMP/release-version.json"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: espressif/esp-idf
          ref: fff9895c82d744c7237be8847347bdd1b07c6643 # v6.1 / 6.1.0, not a moving tag
          path: toolchain/esp-idf
          submodules: recursive
          persist-credentials: false
      - name: Install exact IDF tool manifest
        run: |
          git -C toolchain/esp-idf fetch --depth=1 origin refs/tags/v6.1:refs/tags/v6.1
          test "$(git -C toolchain/esp-idf rev-parse HEAD)" = fff9895c82d744c7237be8847347bdd1b07c6643
          toolchain/esp-idf/install.sh esp32s3
      - name: Build isolated release configuration and verify source correspondence
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          . toolchain/esp-idf/export.sh
          sh tools/tests/run_online_update_guard_tests.sh
          export FOLIO_BUILD_DIR="$RUNNER_TEMP/folio-release-build"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          # Clean pinned IDF uses nonrecursive os.mkdir(build/log); precreate both.
          mkdir -p "$FOLIO_BUILD_DIR/log"
          prefix_map="-ffile-prefix-map=$GITHUB_WORKSPACE=/usr/src/folio -fdebug-prefix-map=$GITHUB_WORKSPACE=/usr/src/folio -ffile-prefix-map=$RUNNER_TEMP=/tmp/folio-build -fdebug-prefix-map=$RUNNER_TEMP=/tmp/folio-build"
          sh tools/idf.sh -D SDKCONFIG="$RUNNER_TEMP/sdkconfig.release" -D "SDKCONFIG_DEFAULTS=$GITHUB_WORKSPACE/sdkconfig.defaults;$GITHUB_WORKSPACE/.github/sdkconfig.release" -D "CMAKE_C_FLAGS=$prefix_map" -D "CMAKE_CXX_FLAGS=$prefix_map" build
          python -m pip install -r .github/release-requirements.txt
          sequence=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/release-version.json"))["sequence"])')
          python tools/release_bundle.py prepare --root "$GITHUB_WORKSPACE" --build-dir "$FOLIO_BUILD_DIR" --output-dir "$RUNNER_TEMP/candidate" --version "${RELEASE_TAG#v}" --sequence "$sequence" --commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14
  sign:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    environment: release-signing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-candidate
          path: ${{ runner.temp }}/candidate
      - name: Require effective environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_ci.py environment release-signing
      - name: Sign only with protected production key
        env:
          FOLIO_SIGNING_KEY_PEM: ${{ secrets.FOLIO_SIGNING_KEY_PEM }}
        run: python tools/release_bundle.py sign --candidate "$RUNNER_TEMP/candidate" --output-dir "$RUNNER_TEMP/signed" --public-key keys/firmware-release-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: sign
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: release
      artifact: signed-release
      tag: ${{ github.ref_name }}
