name: Recover a published release not yet on Pages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Release tag whose Pages deployment failed
        required: true
        type: string
      promotion_run:
        description: For stable recovery, the signing run ID or release-asset for archived signed pointers
        required: false
        type: string
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - name: Recover original signed bytes, without keys, rebuilding or overwrite
        if: inputs.promotion_run == ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo qmqsu/folio --pattern folio-offline.zip --dir "$RUNNER_TEMP/download"
          python tools/release_ci.py extract --zip "$RUNNER_TEMP/download/folio-offline.zip" --output "$RUNNER_TEMP/candidate"
          python tools/release_manifest.py "$RUNNER_TEMP/candidate/ota.json" --public-key keys/firmware-release-public.pem
      - name: Recover the original approved stable pointers
        if: inputs.promotion_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PROMOTION_RUN: ${{ inputs.promotion_run }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          if [[ "$PROMOTION_RUN" == release-asset ]]; then
            gh release download "$RELEASE_TAG" --repo qmqsu/folio --pattern stable-promotion.zip --dir "$RUNNER_TEMP/download"
            python tools/release_ci.py extract --zip "$RUNNER_TEMP/download/stable-promotion.zip" --output "$RUNNER_TEMP/candidate"
          else
            [[ "$PROMOTION_RUN" =~ ^[0-9]+$ ]]
            workflow=$(gh api "repos/qmqsu/folio/actions/runs/$PROMOTION_RUN" --jq 'select(.event == "workflow_dispatch" and .head_branch == "main") | .path')
            test "$workflow" = ".github/workflows/promote.yml"
            gh run download "$PROMOTION_RUN" --repo qmqsu/folio --name stable-promotion --dir "$RUNNER_TEMP/candidate"
          fi
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import release_manifest as protocol
          folder = Path(os.environ['RUNNER_TEMP']) / 'candidate'
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          key = protocol.public_key('keys/firmware-release-public.pem')
          for kind in ('ota', 'usb'):
              payload = protocol.verify((folder / (kind + '.json')).read_bytes(), key)
              protocol.require((payload['kind'], payload['channel'], payload['version']) == (kind, 'stable', version),
                               'Stable artifact does not match requested release')
          record = protocol.load_json((folder / 'acceptance.json').read_bytes())
          expected = protocol.load_json(Path(f'.github/release-acceptance/{version}.json').read_bytes())
          protocol.require(record == expected, 'Release decision differs from main')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-release
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: recover
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: ${{ inputs.promotion_run != '' && 'promote' || 'recover' }}
      artifact: recovered-release
      tag: ${{ inputs.tag }}
