name: Recover a published release not yet on Pages
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable Release tag whose Pages deployment failed
        required: true
        type: string
permissions:
  contents: read
jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - name: Recover original signed bytes, without keys, rebuilding or overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo qmqsu/folio --pattern folio-offline.zip --dir "$RUNNER_TEMP/download"
          python tools/release_ci.py extract --zip "$RUNNER_TEMP/download/folio-offline.zip" --output "$RUNNER_TEMP/candidate"
          python tools/release_manifest.py "$RUNNER_TEMP/candidate/ota.json" --public-key keys/firmware-release-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: recovered-release
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: recover
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: recover
      artifact: recovered-release
      tag: ${{ inputs.tag }}
