name: Promote hardware-accepted stable release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing preview tag with no -dev or -rc suffix (e.g. v0.8.32)
        required: true
        type: string
permissions:
  contents: read
jobs:
  acceptance-and-sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    environment: release-stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - name: Download the already signed candidate; NEVER rebuild on promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          case "$RELEASE_TAG" in *-*) echo 'Prerelease cannot be promoted'; exit 1 ;; esac
          gh release download "$RELEASE_TAG" --repo qmqsu/folio --pattern folio-offline.zip --dir "$RUNNER_TEMP/download"
          python tools/release_ci.py extract --zip "$RUNNER_TEMP/download/folio-offline.zip" --output "$RUNNER_TEMP/candidate"
      - name: Require effective environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_ci.py environment release-stable
      - name: Enforce exact hardware evidence and sign stable pointers
        env:
          FOLIO_SIGNING_KEY_PEM: ${{ secrets.FOLIO_SIGNING_KEY_PEM }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_bundle.py promote --candidate "$RUNNER_TEMP/candidate" --output-dir "$RUNNER_TEMP/promotion" --acceptance ".github/release-acceptance/${RELEASE_TAG#v}.json" --public-key keys/firmware-release-public.pem
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-promotion
          path: ${{ runner.temp }}/promotion
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: acceptance-and-sign
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      mode: promote
      artifact: stable-promotion
      tag: ${{ inputs.tag }}
