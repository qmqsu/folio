name: Atomic Pages publisher
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      artifact:
        default: ''
        type: string
      tag:
        default: ''
        type: string
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: folio-pages-publication
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      # Always build the current main site: a late tag workflow cannot restore old web code.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.3'
      - run: python -m pip install -r .github/release-requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm install --global pnpm@11.28.5
      - run: pnpm install --frozen-lockfile && pnpm test && pnpm run check && pnpm run build
        working-directory: site
      - if: inputs.mode != 'site'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/incoming
      - name: Read authoritative deployment state inside the serialization lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_ci.py read-state --output "$RUNNER_TEMP/state"
      - name: Verify and assemble firmware, pointers and site together
        env:
          MODE: ${{ inputs.mode }}
        run: |
          args=()
          if test -f "$RUNNER_TEMP/state/previous.tar.gz"; then
            sha=$(python -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/state/authority.json"))["state"]["snapshot_sha256"])')
            args+=(--previous "$RUNNER_TEMP/state/previous.tar.gz" --expected-sha256 "$sha")
          fi
          case "$MODE" in
            site) ;;
            release|recover) args+=(--candidate "$RUNNER_TEMP/incoming") ;;
            promote) args+=(--promotion "$RUNNER_TEMP/incoming") ;;
            *) exit 1 ;;
          esac
          python tools/release_pages.py --site site/dist --public-key keys/firmware-release-public.pem --output "$RUNNER_TEMP/pages" "${args[@]}"
      - name: Publish immutable source, license and offline materials before exposing firmware pointers
        if: inputs.mode == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          python tools/release_bundle.py zip --directory "$RUNNER_TEMP/incoming" --output "$RUNNER_TEMP/folio-offline.zip"
          gh release create "$RELEASE_TAG" --repo qmqsu/folio --verify-tag --prerelease --title "Folio $RELEASE_TAG · preview" --notes 'Preview only. CI is not device acceptance. Verify raw P-256 signatures and materials.json against the pinned publisher key. No merged/erase-all/default font installation.' "$RUNNER_TEMP/folio-offline.zip" "$RUNNER_TEMP/incoming/source.tar.gz" "$RUNNER_TEMP/incoming/relink.tar.gz" "$RUNNER_TEMP/incoming/materials.json" "$RUNNER_TEMP/incoming/materials.sig" "$RUNNER_TEMP/incoming/ota.json" "$RUNNER_TEMP/incoming/usb.json"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/pages
      - name: Atomically deploy the complete Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify live snapshot and commit compare-and-swap authority
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/release_ci.py commit-state --authority "$RUNNER_TEMP/state/authority.json" --site "$RUNNER_TEMP/pages"
      - name: Mark hardware-accepted release stable after atomic promotion
        if: inputs.mode == 'promote'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python tools/release_ci.py version "$RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --repo qmqsu/folio --prerelease=false --title "Folio $RELEASE_TAG · stable"
